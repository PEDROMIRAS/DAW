<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
    <body>
        <p id="listado"></p>
        <script>
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    recuperaDatos(xhttp.responseXML);
                }
            };
            xhttp.open("GET", "U6_ECen01_Books.xml", true);
            xhttp.send();

            function recuperaDatos(xml) {
                var datos = " ";
                path = " /catalog/book/title";
                if(xml.evaluate){
                    var nodos = xml.evaluate(path, xml, null, XPathResult.ANY_TYPE, null);
                    var resultado = nodos.iterateNext();
                    while (resultado) {
                        datos = datos + "Title: " + resultado.childNodes[0].nodeValue + "<br>";
                        resultado = nodos.iterateNext();
                    }
                }
                document.getElementById("listado").innerHTML = datos;
            }
        </script>
    </body>
</html>
