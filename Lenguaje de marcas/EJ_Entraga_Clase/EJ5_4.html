<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
</head>
<body>
    <p id="listado"></p>
    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                recuperaDatos(xhttp.responseXML);
            }
        };
        xhttp.open("GET", "U6_ECen02_students.xml", true);
        xhttp.send();

        function recuperaDatos(xml) {
            var datos = "";
            var path = "/ies/ciclos/ciclo[RealdecretoTitulo/@año='2023']/@id";
            if(xml.evaluate){
                var nodos = xml.evaluate(path, xml, null, XPathResult.ANY_TYPE, null);
                var resultado = nodos.iterateNext();
                while (resultado) {
                    datos += "Modulo: " + resultado.textContent + "<br>";
                    resultado = nodos.iterateNext();
                }
            }
            document.getElementById("listado").innerHTML = datos;
        }
    </script>
</body>
</html>
